<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Globe Test (Standalone)</title>
  <style>
    :root {
      --bg-a: #05070c;
      --bg-b: #0b1220;
      --text: #e7eef8;
      --muted: #9fb0c8;
      --accent: #6fd3ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1000px 600px at 12% 10%, #14233f 0%, transparent 60%),
        radial-gradient(900px 500px at 88% 90%, #101c36 0%, transparent 58%),
        linear-gradient(145deg, var(--bg-a), var(--bg-b));
      overflow: hidden;
    }

    .shell {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #globeViz {
      position: absolute;
      inset: 0;
    }

    .hud {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 5;
      padding: 10px 12px;
      border: 1px solid rgba(140, 170, 210, 0.35);
      border-radius: 10px;
      background: rgba(6, 11, 20, 0.72);
      backdrop-filter: blur(6px);
      max-width: min(92vw, 360px);
    }

    .hud h1 {
      margin: 0 0 4px;
      font-size: 1rem;
      letter-spacing: 0.02em;
      color: var(--accent);
    }

    .hud p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.4;
    }

  </style>
</head>
<body>
  <div class="shell">
    <div id="globeViz" aria-label="Interactive Earth globe"></div>
    <div class="hud">
      <h1>Location Details</h1>
      <p id="locationText">Click a rectangle or badge label to open the related highlight page.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
  <script>
    const points = [];
    const locationText = document.getElementById("locationText");
    const elevatedPolygons = [
      {
        name: "Projects",
        url: "projects.html",
        geometry: {
          type: "Polygon",
          coordinates: [[
            [-150, 12], [-125, 12], [-125, -12], [-150, -12], [-150, 12]
          ]]
        }
      },
      {
        name: "Experience",
        url: "experience.html",
        geometry: {
          type: "Polygon",
          coordinates: [[
            [-110, 12], [-85, 12], [-85, -12], [-110, -12], [-110, 12]
          ]]
        }
      },
      {
        name: "Education",
        url: "education.html",
        geometry: {
          type: "Polygon",
          coordinates: [[
            [-70, 12], [-45, 12], [-45, -12], [-70, -12], [-70, 12]
          ]]
        }
      },
      {
        name: "Engagement",
        url: "engagement.html",
        geometry: {
          type: "Polygon",
          coordinates: [[
            [-30, 12], [-5, 12], [-5, -12], [-30, -12], [-30, 12]
          ]]
        }
      },
      {
        name: "About",
        url: "about.html",
        geometry: {
          type: "Polygon",
          coordinates: [[
            [10, 12], [35, 12], [35, -12], [10, -12], [10, 12]
          ]]
        }
      }
    ];
    const labelBadges = [
      { name: "Projects", lat: 0, lng: -137.5, url: "projects.html", color: "#1f232b" },
      { name: "Experience", lat: 0, lng: -97.5, url: "experience.html", color: "#1f232b" },
      { name: "Education", lat: 0, lng: -57.5, url: "education.html", color: "#1f232b" },
      { name: "Engagement", lat: 0, lng: -17.5, url: "engagement.html", color: "#1f232b" },
      { name: "About", lat: 0, lng: 22.5, url: "about.html", color: "#1f232b" }
    ];

    const globe = Globe()(document.getElementById("globeViz"))
      .globeImageUrl("https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg")
      .bumpImageUrl("https://unpkg.com/three-globe/example/img/earth-topology.png")
      .backgroundColor("rgba(0,0,0,0)")
      .atmosphereColor("#9ed1ff")
      .atmosphereAltitude(0.15)
        .pointsData(points)
        .polygonsData(elevatedPolygons)
        .polygonGeoJsonGeometry((d) => d.geometry)
        .polygonCapColor(() => "rgba(205, 215, 230, 0.5)")
        .polygonSideColor(() => "rgba(80, 92, 108, 0.35)")
        .polygonStrokeColor(() => "#f4f8ff")
        .polygonAltitude(0.18)
        .polygonLabel(p => p.name)
        .labelsData(labelBadges)
        .labelLat((d) => d.lat)
        .labelLng((d) => d.lng)
        .labelAltitude(0.18)
        .labelText((d) => d.name)
        .labelSize(1.9)
        .labelDotRadius(0.3)
        .labelColor((d) => d.color)
        .labelResolution(3)
        .labelIncludeDot(true)
        .onLabelClick((d) => {
          locationText.textContent = d.name + " selected. Opening: " + d.url;
          window.open(d.url, "_blank", "noopener,noreferrer");
        })
        .onPolygonClick((p) => {
          locationText.textContent = p.name + " selected. Opening: " + p.url;
          window.open(p.url, "_blank", "noopener,noreferrer");
        });

    globe.controls().autoRotate = true;
    globe.controls().autoRotateSpeed = 0.7;
    globe.pointOfView({ lat: 0, lng: -60, altitude: 2.0 }, 0);

    globe
      .globeImageUrl("assets/globe/moon.jpg")
      .bumpImageUrl("https://unpkg.com/three-globe/example/img/earth-topology.png")
      .backgroundColor("rgba(0,0,0,0)")
      .backgroundImageUrl("https://unpkg.com/three-globe/example/img/night-sky.png")
      .showAtmosphere(true)
      .atmosphereColor("#a9b4c3")
      .atmosphereAltitude(0.06);

    window.addEventListener("resize", () => {
      globe.width(window.innerWidth);
      globe.height(window.innerHeight);
    });

    globe.width(window.innerWidth);
    globe.height(window.innerHeight);
  </script>
</body>
</html>

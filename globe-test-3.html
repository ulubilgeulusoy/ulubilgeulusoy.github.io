<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Globe Test (Standalone)</title>
  <style>
    :root {
      --bg-a: #05070c;
      --bg-b: #0b1220;
      --text: #e7eef8;
      --muted: #9fb0c8;
      --accent: #6fd3ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1000px 600px at 12% 10%, #14233f 0%, transparent 60%),
        radial-gradient(900px 500px at 88% 90%, #101c36 0%, transparent 58%),
        linear-gradient(145deg, var(--bg-a), var(--bg-b));
      overflow: hidden;
    }

    .shell {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #globeViz {
      position: absolute;
      inset: 0;
    }

    .hud {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 5;
      padding: 10px 12px;
      border: 1px solid rgba(140, 170, 210, 0.35);
      border-radius: 10px;
      background: rgba(6, 11, 20, 0.72);
      backdrop-filter: blur(6px);
      max-width: min(92vw, 360px);
    }

    .hud h1 {
      margin: 0 0 4px;
      font-size: 1rem;
      letter-spacing: 0.02em;
      color: var(--accent);
    }

    .hud p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.4;
    }

  </style>
</head>
<body>
  <div class="shell">
    <div id="globeViz" aria-label="Interactive Earth globe"></div>
    <div class="hud">
      <h1>Location Details</h1>
      <p id="locationText">Click a photo to open the related highlight page.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
  <script>
    const locationText = document.getElementById("locationText");
    const photoPins = [
      { name: "Projects", lat: 0, lng: -137.5, img: "project_pictures/experiment_setup.jpg", url: "projects.html" },
      { name: "Experience", lat: 0, lng: -97.5, img: "highlight_pictures/experience.jpg", url: "experience.html" },
      { name: "Education", lat: 0, lng: -57.5, img: "highlight_pictures/about.jpg", url: "education.html" },
      { name: "Engagement", lat: 0, lng: -17.5, img: "highlight_pictures/engagement.jpg", url: "engagement.html" },
      { name: "About", lat: 0, lng: 22.5, img: "galatasaray/gala_1.jpg", url: "about.html" }
    ];
    const pinEls = new Map();

    const globe = Globe()(document.getElementById("globeViz"))
      .globeImageUrl("https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg")
      .bumpImageUrl("https://unpkg.com/three-globe/example/img/earth-topology.png")
      .backgroundColor("rgba(0,0,0,0)")
      .atmosphereColor("#a9b4c3")
      .atmosphereAltitude(0.06)
        .htmlElementsData(photoPins)
        .htmlLat((d) => d.lat)
        .htmlLng((d) => d.lng)
        .htmlAltitude(0.11)
        .htmlTransitionDuration(0)
        .htmlElement((d) => {
          const wrap = document.createElement("div");
          wrap.style.width = "178px";
          wrap.style.border = "1px solid rgba(220, 232, 248, 0.6)";
          wrap.style.borderRadius = "10px";
          wrap.style.overflow = "hidden";
          wrap.style.background = "rgba(8, 14, 26, 0.9)";
          wrap.style.boxShadow = "0 8px 20px rgba(0, 0, 0, 0.45)";
          wrap.style.cursor = "pointer";
          wrap.style.position = "relative";
          const img = document.createElement("img");
          img.src = d.img;
          img.alt = d.name + " highlight";
          img.style.display = "block";
          img.style.width = "100%";
          img.style.height = "108px";
          img.style.objectFit = "cover";
          wrap.appendChild(img);
          const label = document.createElement("div");
          label.textContent = d.name;
          label.style.position = "absolute";
          label.style.left = "0";
          label.style.right = "0";
          label.style.bottom = "0";
          label.style.padding = "8px 10px";
          label.style.fontSize = "0.9rem";
          label.style.fontWeight = "700";
          label.style.letterSpacing = "0.02em";
          label.style.color = "#f5f9ff";
          label.style.background = "linear-gradient(to top, rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.15))";
          label.style.textShadow = "0 1px 2px rgba(0, 0, 0, 0.65)";
          wrap.appendChild(label);
          wrap.addEventListener("click", function (event) {
            event.stopPropagation();
            locationText.textContent = d.name + " selected. Opening: " + d.url;
            window.open(d.url, "_blank", "noopener,noreferrer");
          });
          pinEls.set(d.name, wrap);
          return wrap;
        });

    globe.controls().autoRotate = true;
    globe.controls().autoRotateSpeed = 0.45;
    globe.pointOfView({ lat: 0, lng: -60, altitude: 2.0 }, 0);

    globe.globeImageUrl("assets/globe/moon.jpg");

    function degToRad(v) { return v * Math.PI / 180; }
    function angularDistanceDeg(aLat, aLng, bLat, bLng) {
      const a1 = degToRad(aLat);
      const b1 = degToRad(aLng);
      const a2 = degToRad(bLat);
      const b2 = degToRad(bLng);
      const cosDelta = Math.sin(a1) * Math.sin(a2) + Math.cos(a1) * Math.cos(a2) * Math.cos(b1 - b2);
      return Math.acos(Math.max(-1, Math.min(1, cosDelta))) * 180 / Math.PI;
    }
    function updatePinVisibility() {
      const pov = globe.pointOfView();
      if (!pov) return;
      photoPins.forEach((pin) => {
        const el = pinEls.get(pin.name);
        if (!el) return;
        const angle = angularDistanceDeg(pov.lat || 0, pov.lng || 0, pin.lat, pin.lng);
        const visible = angle < 72;
        el.style.opacity = visible ? "1" : "0";
        el.style.pointerEvents = visible ? "auto" : "none";
      });
      requestAnimationFrame(updatePinVisibility);
    }
    requestAnimationFrame(updatePinVisibility);

    window.addEventListener("resize", () => {
      globe.width(window.innerWidth);
      globe.height(window.innerHeight);
    });

    globe.width(window.innerWidth);
    globe.height(window.innerHeight);
  </script>
</body>
</html>

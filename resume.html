  <script>
    (function sizeResumeViewer() {
      const viewer = document.querySelector(".resume-document");
      function resize() {
        // The current PDF is one A4 page; reserve space for the viewer toolbar and margins.
        viewer.style.height = Math.ceil(viewer.clientWidth * (841.89 / 595.28) + 120) + "px";
      }
      resize();
      if ("ResizeObserver" in window) {
        const observer = new ResizeObserver(resize);
        observer.observe(viewer.parentElement);
      } else {
        window.addEventListener("resize", resize);
      }
    })();
  </script>
